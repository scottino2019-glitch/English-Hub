<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Vocabolario &amp; Modi di Dire — English Hub</title>
    <meta
      name="description"
      content="Metti alla prova il tuo lessico inglese con quiz interattivi divisi per livello CEFR, pronuncia e spiegazioni."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-page="quiz">
    <div class="page-shell">
      <div class="page-container">
        <header id="site-header" class="site-header"></header>

        <section class="subpage-banner">
          <div>
            <div class="meta-line">
              <a href="/" style="text-decoration: underline;">← Torna alla Homepage</a>
              <span aria-hidden="true">·</span>
              <span>Modulo Lessico &amp; Idioms</span>
            </div>
            <h1 style="font-size: clamp(1.75rem, 3vw, 2.5rem); font-weight: 800; margin-top: 0.5rem;">
              Quiz Vocabolario Inglese
            </h1>
            <p style="color: #d1fae5; max-width: 56ch; margin-top: 0.375rem;">
              Filtra per livello CEFR, ascolta la pronuncia britannica di ogni termine e verifica il contesto d’uso.
            </p>
          </div>
          <div id="quiz-level-filter" class="segmented-bar" role="group" aria-label="Filtra domande per livello">
            <button type="button" class="segmented-btn is-active" data-level="ALL">Tutti</button>
            <button type="button" class="segmented-btn" data-level="A2">A2</button>
            <button type="button" class="segmented-btn" data-level="B1">B1</button>
            <button type="button" class="segmented-btn" data-level="B2">B2</button>
            <button type="button" class="segmented-btn" data-level="C1">C1</button>
          </div>
        </section>

        <main class="subpage-grid">
          <section class="bento-card card-white">
            <div class="card-header">
              <div>
                <h2 id="quiz-progress" class="card-title tabular-nums">Domanda 01 / 06</h2>
                <p id="quiz-score" class="card-subtitle tabular-nums">0 XP · 0 corrette</p>
              </div>
              <button type="button" id="quiz-speak-term" class="btn-audio-icon">
                Ascolta Termine
              </button>
            </div>

            <p id="quiz-prompt" style="font-size: 1.25rem; font-weight: 800; line-height: 1.35;"></p>

            <div id="quiz-options" class="options-grid options-grid--2"></div>

            <div id="quiz-feedback" class="feedback-box"></div>

            <div style="display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;">
              <button type="button" id="quiz-reset-btn" class="btn btn-white">
                Azzera Sessione
              </button>
              <button type="button" id="quiz-next-btn" class="btn btn-amber">
                Prossima Domanda →
              </button>
            </div>
          </section>

          <aside class="bento-card card-slate">
            <div class="card-header">
              <div>
                <h2 class="card-title">Registro Risposte</h2>
                <p class="card-subtitle">Cronologia della sessione corrente</p>
              </div>
            </div>
            <div id="quiz-history-list"></div>
          </aside>
        </main>

        <footer id="site-footer" class="site-footer"></footer>
      </div>
    </div>

    <script defer src="/app.js"></script>
  </body>
</html>
